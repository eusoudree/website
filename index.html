<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREE | Hub </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff8c00;
            --bg: #000000;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            flex-direction: column;
        }

        #nebula-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; filter: blur(60px);
            opacity: 0; transition: opacity 2s ease;
        }

        #mouse-light {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.12) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%); z-index: 3;
        }

        .glass-card {
            position: relative; z-index: 10;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; padding: 50px 30px;
            width: 85%; max-width: 350px; text-align: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Container da Agenda Inline */
        #calendar-container {
            display: none;
            width: 95%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95); /* Fundo claro para legibilidade da agenda */
            border-radius: 30px;
            overflow: hidden;
            z-index: 20;
            animation: slideUp 0.8s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-pic {
            width: 130px; height: 130px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 25px; object-fit: cover;
            object-position: top !important;
            cursor: pointer; transition: 0.4s;
        }

        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .link-btn {
            background: rgba(255, 255, 255, 0.06); color: white;
            text-decoration: none; padding: 18px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05); font-weight: 500;
            transition: 0.3s; cursor: pointer;
        }
        .link-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--accent); }

        .btn-agenda {
            background: rgba(255, 140, 0, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 700;
        }

        .game-hint {
            margin-top: 25px; font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; color: var(--accent); letter-spacing: 1px;
            text-transform: uppercase; opacity: 0.8;
            animation: pulse 2s infinite ease-in-out; z-index: 10;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        #game-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 100; justify-content: center; align-items: center;
        }

        canvas#gameCanvas { width: 85%; height: 80%; border: 1px solid #333; background: rgba(0,0,0,0.92); }

        .back-btn {
            margin-top: 20px; color: var(--accent); cursor: pointer; font-size: 0.8rem; text-transform: uppercase;
        }
    </style>
</head>

    </div>
