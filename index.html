<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREE | Hub </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff8c00;
            --bg: #000000;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            flex-direction: column;
        }

        #nebula-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; filter: blur(60px);
            opacity: 0; transition: opacity 2s ease;
        }

        #mouse-light {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.12) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%); z-index: 3;
        }

        .glass-card {
            position: relative; z-index: 10;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; padding: 50px 30px;
            width: 85%; max-width: 350px; text-align: center;
            transition: all 0.5s ease;
        }

        .profile-pic {
            width: 130px; height: 130px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 25px; object-fit: cover;
            object-position: top !important;
            cursor: pointer; transition: 0.4s;
        }

        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .link-btn {
            background: rgba(255, 255, 255, 0.06); color: white;
            text-decoration: none; padding: 18px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05); font-weight: 500;
            transition: 0.3s;
        }
        .link-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--accent); }

        .game-hint {
            margin-top: 25px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
            animation: pulse 2s infinite ease-in-out;
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #game-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 100; justify-content: center; align-items: center;
        }

        canvas#gameCanvas { width: 85%; height: 80%; border: 1px solid #333; background: rgba(0,0,0,0.92); }

        #game-over-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px;
            padding: 40px; text-align: center; display: none; z-index: 110;
        }

        .retry-btn {
            margin-top: 20px; padding: 15px 40px; background: var(--accent);
            border: none; border-radius: 15px; color: black; font-weight: bold; cursor: pointer;
        }

        .burn-out { animation: burnOut 0.6s forwards; }
        @keyframes burnOut {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(0.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="nebula-canvas"></canvas>
    <div id="mouse-light"></div>

    <div class="glass-card" id="main-card">
        <img src="https://lh3.googleusercontent.com/pw/AP1GczMHY54S59lzm9tR_4jnxARGJBGOaavqxSxHhJyHwwajwZ9ZZAZYjdDGW-lx7zwW6giesIVxCgXIPZLsZN0wG8tTELncrRVgMBEhuU3OqujUQqsvp6WjRVDvd_d-EkGbRb9e326ISktPMoRsksGcBMe-xQ=w1074-h1912-s-no?authuser=0" alt="Dree" class="profile-pic" id="profile-img">
        <h1 style="font-size: 2.2rem; margin: 0; letter-spacing: -1px;">Dree</h1>
        <p style="color: #888; margin-bottom: 35px; letter-spacing: 2px; font-size: 0.8rem;">ANCESTRALIDADE • TECH</p>

        <div class="links-container">
            <a href="https://instagram.com/eusoudree" class="link-btn" target="_blank">Instagram</a>
            <a href="https://wa.me/5512981946599" class="link-btn" target="_blank">WhatsApp</a>
            <a href="mailto:oi@dree.one" class="link-btn">E-mail</a>
        </div>
    </div>

    <div class="game-hint" id="game-hint">clique na foto para defender o seu legado</div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-over-screen">
            <h2 style="color:var(--accent); margin-top:0; font-family:'JetBrains Mono'">GAME OVER</h2>
            <div style="font-size: 1.5rem; margin: 20px 0;">PONTOS: <span id="final-score">0</span></div>
            <button class="retry-btn" onclick="location.reload()">RECONECTAR SISTEMA</button>
        </div>
    </div>

    <script>
        const card = document.getElementById('main-card');
        const hint = document.getElementById('game-hint');
        const profileImg = document.getElementById('profile-img');
        const light = document.getElementById('mouse-light');
        const nebulaCanvas = document.getElementById('nebula-canvas');
        const gameCanvas = document.getElementById('gameCanvas');
        const nCtx = nebulaCanvas.getContext('2d');
        const gCtx = gameCanvas.getContext('2d');
        const gameOverScreen = document.getElementById('game-over-screen');

        let particles = [];
        let gameActive = false;
        let score = 0;
        let enemies = [];
        let shots = [];
        let player = { x: 30, y: 0, w: 80, h: 80 };

        function setup() {
            nebulaCanvas.width = window.innerWidth;
            nebulaCanvas.height = window.innerHeight;
            gameCanvas.width = window.innerWidth * 0.85;
            gameCanvas.height = window.innerHeight * 0.8;
            player.y = gameCanvas.height / 2;
        }
        window.onresize = setup;
        setup();

        class P {
            constructor() {
                this.x = Math.random() * nebulaCanvas.width;
                this.y = Math.random() * nebulaCanvas.height;
                this.s = Math.random() * 120 + 40;
                this.c = Math.random() > 0.5 ? 'rgba(255, 140, 0, 0.15)' : 'rgba(80, 0, 180, 0.08)';
            }
            draw() { nCtx.fillStyle = this.c; nCtx.beginPath(); nCtx.arc(this.x, this.y, this.s, 0, Math.PI*2); nCtx.fill(); }
        }

        profileImg.onclick = () => {
            card.classList.add('burn-out');
            hint.style.display = 'none';
            setTimeout(() => {
                card.style.display = 'none';
                document.getElementById('game-container').style.display = 'flex';
                nebulaCanvas.style.opacity = "1";
                for(let i=0; i<30; i++) particles.push(new P());
                const animN = () => {
                    nCtx.clearRect(0,0,nebulaCanvas.width, nebulaCanvas.height);
                    particles.forEach(p => p.draw());
                    if(gameActive) requestAnimationFrame(animN);
                };
                animN();
                gameActive = true;
                const spawn = () => {
                    if(!gameActive) return;
                    enemies.push({ x: gameCanvas.width + 50, y: Math.random()*(gameCanvas.height-60), w: 35, h: 50, spd: 3.5 + (score/400) });
                    setTimeout(spawn, Math.max(450, 1100 - (score*2)));
                };
                spawn();
                requestAnimationFrame(loop);
            }, 600);
        };

        function drawSkeleton(x, y) {
            const c = "#ff8c00";
            gCtx.strokeStyle = c; gCtx.lineWidth = 2.5;

            gCtx.beginPath();
            gCtx.arc(x+15, y+10, 10, 0, Math.PI*2);
            gCtx.stroke();
            gCtx.fillStyle = c;
            gCtx.beginPath(); gCtx.arc(x+18, y+8, 2, 0, Math.PI*2); gCtx.fill();

            gCtx.beginPath();
            gCtx.moveTo(x+15, y+20); gCtx.lineTo(x+15, y+50);
            for(let i=0; i<3; i++) {
                gCtx.moveTo(x+5, y+25+(i*7)); gCtx.lineTo(x+25, y+25+(i*7));
            }
            gCtx.moveTo(x+15, y+25); gCtx.lineTo(x+45, y+25);
            gCtx.stroke();

            const tx = x + 50;
            gCtx.shadowBlur = 15; gCtx.shadowColor = c;
            gCtx.beginPath();
            gCtx.moveTo(tx, y+55); gCtx.lineTo(tx, y-15);
            gCtx.moveTo(tx-12, y+5); gCtx.bezierCurveTo(tx-12, y+20, tx+12, y+20, tx+12, y+5);
            gCtx.moveTo(tx-12, y+10); gCtx.lineTo(tx-12, y-5);
            gCtx.moveTo(tx+12, y+10); gCtx.lineTo(tx+12, y-5);
            gCtx.stroke();
            gCtx.shadowBlur = 0;
        }

        function drawGrave(en) {
            gCtx.fillStyle = "#111"; gCtx.beginPath();
            gCtx.roundRect(en.x, en.y, en.w, en.h, [10, 10, 0, 0]); gCtx.fill();
            gCtx.strokeStyle = "#444"; gCtx.stroke();
            gCtx.strokeStyle = "#ff8c0044"; gCtx.beginPath();
            gCtx.moveTo(en.x+en.w/2, en.y+10); gCtx.lineTo(en.x+en.w/2, en.y+35);
            gCtx.moveTo(en.x+8, en.y+22); gCtx.lineTo(en.x+en.w-8, en.y+22);
            gCtx.stroke();
        }

        document.onmousemove = (e) => {
            light.style.left = e.clientX + 'px'; light.style.top = e.clientY + 'px';
            if(gameActive) {
                const r = gameCanvas.getBoundingClientRect();
                player.y = (e.clientY - r.top) - 25;
            }
        };

        let lastS = 0;
        function loop(t) {
            if(!gameActive) return;
            gCtx.clearRect(0,0, gameCanvas.width, gameCanvas.height);

            drawSkeleton(player.x, player.y);

            if(t - lastS > 140) {
                shots.push({ x: player.x+60, y: player.y+5, s: 5 });
                lastS = t;
            }

            shots.forEach((s, i) => {
                s.x += 14;
                gCtx.fillStyle = `rgb(255, ${130+Math.random()*125}, 0)`;
                gCtx.beginPath(); gCtx.arc(s.x, s.y, s.s, 0, Math.PI*2); gCtx.fill();
                if(s.x > gameCanvas.width) shots.splice(i, 1);
                enemies.forEach((en, ei) => {
                    if(s.x > en.x && s.x < en.x+en.w && s.y > en.y && s.y < en.y+en.h) {
                        enemies.splice(ei, 1); shots.splice(i, 1); score += 10;
                    }
                });
            });

            enemies.forEach(en => {
                en.x -= en.spd;
                drawGrave(en);
                if(en.x < 0) {
                    gameActive = false;
                    document.getElementById('final-score').innerText = score;
                    gameOverScreen.style.display = 'block';
                    nebulaCanvas.style.opacity = "0";
                }
            });

            gCtx.fillStyle = "#ff8c00"; gCtx.font = "bold 16px JetBrains Mono";
            gCtx.fillText("SCORE: " + score, 20, 40);
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
